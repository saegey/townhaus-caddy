// Shairport Sync config managed by this repo.
// Edit this file, then deploy with deploy/deploy_shairport_config.sh.

general = {
  name = "aswitch";
  interpolation = "soxr";
  output_backend = "alsa";
  // Volume is driven externally (MQTT), so don't let Shairport attenuate the
  // PCM stream — matches pi-cam behavior.
  ignore_volume_control = "yes";
};

alsa = {
  output_device = "plughw:CARD=CODEC,DEV=0";
};

mqtt = {
  enabled = "yes";
  hostname = "homeassistant.local"; // set to your MQTT broker hostname
  port = 1883;
  topic = "aswitch/shairport";
  // Publish parsed metadata (including AirPlay volume) and cover art to MQTT,
  // like pi-cam.
  publish_parsed = "yes";
  publish_cover = "yes";
};

metadata = {
  enabled = "yes";
  include_cover_art = "yes";
};
