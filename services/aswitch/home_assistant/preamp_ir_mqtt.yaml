mqtt:
  button:
    - name: "Preamp Volume Up"
      unique_id: "aswitch_preamp_volume_up"
      command_topic: "aswitch/ir/send"
      payload_press: "vol_up"
      availability_topic: "aswitch/ir/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:volume-plus"

    - name: "Preamp Volume Down"
      unique_id: "aswitch_preamp_volume_down"
      command_topic: "aswitch/ir/send"
      payload_press: "vol_down"
      availability_topic: "aswitch/ir/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:volume-minus"

    - name: "Preamp Mute"
      unique_id: "aswitch_preamp_mute"
      command_topic: "aswitch/ir/send"
      payload_press: "mute"
      availability_topic: "aswitch/ir/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:volume-mute"

    - name: "Preamp Input"
      unique_id: "aswitch_preamp_input"
      command_topic: "aswitch/ir/send"
      payload_press: "input"
      availability_topic: "aswitch/ir/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:video-input-hdmi"

    - name: "Preamp Light"
      unique_id: "aswitch_preamp_light"
      command_topic: "aswitch/ir/send"
      payload_press: "light"
      availability_topic: "aswitch/ir/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:lightbulb-outline"

    - name: "Preamp Power"
      unique_id: "aswitch_preamp_power"
      command_topic: "aswitch/ir/send"
      payload_press: "power"
      availability_topic: "aswitch/ir/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:power"

  sensor:
    - name: "Preamp IR Last Sent"
      unique_id: "aswitch_preamp_ir_last_sent"
      state_topic: "aswitch/ir/sent"
      value_template: "{{ value_json.button }}"
      availability_topic: "aswitch/ir/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:remote"

    - name: "Preamp IR Last Received"
      unique_id: "aswitch_preamp_ir_last_received"
      state_topic: "aswitch/ir/received"
      value_template: "{{ value_json.button | default(value_json.fingerprint_hex, true) }}"
      availability_topic: "aswitch/ir/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:remote-tv"

    - name: "Preamp IR Last Received Fingerprint"
      unique_id: "aswitch_preamp_ir_last_received_fingerprint"
      state_topic: "aswitch/ir/received"
      value_template: "{{ value_json.fingerprint_hex | default('') }}"
      availability_topic: "aswitch/ir/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:pound"

    - name: "Preamp IR Last Received Frame Type"
      unique_id: "aswitch_preamp_ir_last_received_frame_type"
      state_topic: "aswitch/ir/received"
      value_template: "{{ value_json.frame_type }}"
      availability_topic: "aswitch/ir/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:waves-arrow-right"
