---
- name: Resolve Uptime Kuma credentials from 1Password
  ansible.builtin.command:
    argv: [op, read, "{{ item }}"]
  delegate_to: localhost
  loop:
    - "{{ uptime_kuma_user_ref }}"
    - "{{ uptime_kuma_pass_ref }}"
  register: _uptime_kuma_creds
  changed_when: false
  no_log: true

- name: Store Uptime Kuma credentials
  ansible.builtin.set_fact:
    _uptime_kuma_user: "{{ _uptime_kuma_creds.results[0].stdout }}"
    _uptime_kuma_pass: "{{ _uptime_kuma_creds.results[1].stdout }}"
  no_log: true

- name: Resolve Home Assistant notifier token from 1Password
  ansible.builtin.command:
    argv: [op, read, "{{ uptime_kuma_ha_token_ref }}"]
  delegate_to: localhost
  register: _ha_token_result
  changed_when: false
  no_log: true
  when: uptime_kuma_ha_token_ref is defined

- name: Store Home Assistant token
  ansible.builtin.set_fact:
    _ha_token: "{{ _ha_token_result.stdout }}"
  no_log: true
  when: uptime_kuma_ha_token_ref is defined

- name: Ensure Home Assistant notification is configured
  lucasheld.uptime_kuma.notification:
    api_url: "{{ uptime_kuma_api_url }}"
    api_username: "{{ _uptime_kuma_user }}"
    api_password: "{{ _uptime_kuma_pass }}"
    name: "{{ uptime_kuma_ha_notification_name | default('Home Assistant') }}"
    type: HomeAssistant
    isDefault: true
    applyExisting: true
    homeAssistantUrl: "{{ uptime_kuma_ha_url }}"
    longLivedAccessToken: "{{ _ha_token }}"
    state: present
  delegate_to: localhost
  no_log: true
  when: uptime_kuma_ha_token_ref is defined

- name: Ensure status page exists
  lucasheld.uptime_kuma.status_page:
    api_url: "{{ uptime_kuma_api_url }}"
    api_username: "{{ _uptime_kuma_user }}"
    api_password: "{{ _uptime_kuma_pass }}"
    slug: "{{ uptime_kuma_status_page.slug }}"
    title: "{{ uptime_kuma_status_page.title }}"
    description: "{{ uptime_kuma_status_page.description | default('') }}"
    theme: "{{ uptime_kuma_status_page.theme | default('auto') }}"
    published: "{{ uptime_kuma_status_page.published | default(true) }}"
    showPoweredBy: false
    publicGroupList: "{{ uptime_kuma_status_page.groups }}"
    state: present
  delegate_to: localhost
  no_log: true
  when: uptime_kuma_status_page is defined

- name: Remove retired monitors
  lucasheld.uptime_kuma.monitor:
    api_url: "{{ uptime_kuma_api_url }}"
    api_username: "{{ _uptime_kuma_user }}"
    api_password: "{{ _uptime_kuma_pass }}"
    name: "{{ item }}"
    state: absent
  delegate_to: localhost
  loop: "{{ uptime_kuma_monitors_absent | default([]) }}"
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: Ensure monitors are present
  lucasheld.uptime_kuma.monitor:
    api_url: "{{ uptime_kuma_api_url }}"
    api_username: "{{ _uptime_kuma_user }}"
    api_password: "{{ _uptime_kuma_pass }}"
    name: "{{ item.name }}"
    type: "{{ item.type | default('http') }}"
    url: "{{ item.url }}"
    interval: "{{ item.interval | default(60) }}"
    state: present
  delegate_to: localhost
  loop: "{{ uptime_kuma_monitors }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
