---
- name: Resolve MQTT username from 1Password
  ansible.builtin.command:
    argv: [op, read, "{{ aswitch_mqtt_user_ref }}"]
  delegate_to: localhost
  run_once: false
  register: _mqtt_user_result
  changed_when: false
  no_log: true

- name: Resolve MQTT password from 1Password
  ansible.builtin.command:
    argv: [op, read, "{{ aswitch_mqtt_pass_ref }}"]
  delegate_to: localhost
  run_once: false
  register: _mqtt_pass_result
  changed_when: false
  no_log: true

- name: Store resolved MQTT credentials
  ansible.builtin.set_fact:
    _mqtt_user: "{{ _mqtt_user_result.stdout }}"
    _mqtt_pass: "{{ _mqtt_pass_result.stdout }}"
  no_log: true

- name: Ensure app directory exists
  ansible.builtin.file:
    path: "{{ aswitch_app_dir }}"
    state: directory
    mode: "0755"

- name: Sync Python source files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ aswitch_app_dir }}/{{ item | basename }}"
    mode: "0644"
  loop: "{{ lookup('fileglob', playbook_dir + '/../../services/aswitch/*.py', wantlist=True) }}"
  notify: restart aswitch services

- name: Sync requirements.txt
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../services/aswitch/requirements.txt"
    dest: "{{ aswitch_app_dir }}/requirements.txt"
    mode: "0644"
  notify: install aswitch deps

- name: Create virtualenv and install dependencies
  ansible.builtin.pip:
    requirements: "{{ aswitch_app_dir }}/requirements.txt"
    virtualenv: "{{ aswitch_app_dir }}/.venv"
    virtualenv_command: python3 -m venv

- name: Deploy environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ aswitch_app_dir }}/.env"
    mode: "0600"
  no_log: true
  notify: restart aswitch services

- name: Deploy systemd service units
  ansible.builtin.template:
    src: service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
    mode: "0644"
  loop: "{{ aswitch_services }}"
  become: true
  notify: reload and restart aswitch services

- name: Enable and start services
  ansible.builtin.systemd:
    name: "{{ item.name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ aswitch_services }}"
  become: true
