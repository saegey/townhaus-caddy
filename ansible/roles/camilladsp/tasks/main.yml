---
- name: Load snd-aloop kernel module now
  community.general.modprobe:
    name: snd-aloop
    state: present
  become: true

- name: Persist snd-aloop across reboots
  ansible.builtin.copy:
    content: "snd-aloop\n"
    dest: /etc/modules-load.d/snd-aloop.conf
    mode: "0644"
  become: true

- name: Inspect ALSA playback devices
  ansible.builtin.command:
    argv: [aplay, -l]
  register: camilladsp_aplay_l
  changed_when: false

- name: Inspect ALSA playback device names
  ansible.builtin.command:
    argv: [aplay, -L]
  register: camilladsp_aplay_L
  changed_when: false

- name: Inspect ALSA capture devices
  ansible.builtin.command:
    argv: [arecord, -l]
  register: camilladsp_arecord_l
  changed_when: false

- name: Inspect ALSA sound cards
  ansible.builtin.command:
    argv: [cat, /proc/asound/cards]
  register: camilladsp_asound_cards
  changed_when: false

- name: Validate ALSA loopback card is present
  ansible.builtin.assert:
    that:
      - camilladsp_asound_cards.stdout is search('Loopback')
    fail_msg: >-
      snd-aloop is required for the configured capture path, but no Loopback
      card was found in /proc/asound/cards.
  when: camilladsp_capture_device is search('Loopback')

- name: Validate configured playback card is present
  ansible.builtin.assert:
    that:
      - >
        (camilladsp_asound_cards.stdout is search(camilladsp_playback_card_name))
        or
        (camilladsp_aplay_L.stdout is search('CARD=' ~ camilladsp_playback_card_name))
    fail_msg: >-
      The configured playback card {{ camilladsp_playback_card_name }} was not
      found in /proc/asound/cards or aplay -L.
      /proc/asound/cards={{ camilladsp_asound_cards.stdout | replace('\n', '; ') }}
      aplay -L={{ camilladsp_aplay_L.stdout | replace('\n', '; ') }}
  when:
    - camilladsp_playback_card_name is defined
    - camilladsp_require_playback_card_present | bool

- name: Derive CamillaDSP playback card presence
  ansible.builtin.set_fact:
    camilladsp_playback_card_present: >-
      {{
        (camilladsp_playback_card_name is defined) and
        (
          (camilladsp_asound_cards.stdout is search(camilladsp_playback_card_name))
          or
          (camilladsp_aplay_L.stdout is search('CARD=' ~ camilladsp_playback_card_name))
        )
      }}

- name: Warn when configured playback card is absent
  ansible.builtin.debug:
    msg: >-
      The configured playback card {{ camilladsp_playback_card_name }} is not
      currently present. Deployment will continue, and CamillaDSP recovery will
      start it when the DAC appears. /proc/asound/cards={{
      camilladsp_asound_cards.stdout | replace('\n', '; ') }} aplay -L={{
      camilladsp_aplay_L.stdout | replace('\n', '; ') }}
  when:
    - camilladsp_playback_card_name is defined
    - not (camilladsp_require_playback_card_present | bool)
    - not camilladsp_playback_card_present

- name: Check installed CamillaDSP version
  ansible.builtin.command: "{{ camilladsp_install_dir }}/camilladsp --version"
  register: camilladsp_installed_version
  changed_when: false
  failed_when: false

- name: Download and install CamillaDSP binary
  when: >
    camilladsp_installed_version.rc != 0 or
    camilladsp_version not in camilladsp_installed_version.stdout
  block:
    - name: Download CamillaDSP archive
      ansible.builtin.get_url:
        url: "https://github.com/HEnquist/camilladsp/releases/download/v{{ camilladsp_version }}/camilladsp-linux-aarch64.tar.gz"
        dest: /tmp/camilladsp.tar.gz
        mode: "0644"

    - name: Extract CamillaDSP binary
      ansible.builtin.unarchive:
        src: /tmp/camilladsp.tar.gz
        dest: "{{ camilladsp_install_dir }}"
        remote_src: true
        include:
          - camilladsp
      become: true

    - name: Make CamillaDSP executable
      ansible.builtin.file:
        path: "{{ camilladsp_install_dir }}/camilladsp"
        mode: "0755"
      become: true

- name: Check installed CamillaGUI version
  ansible.builtin.stat:
    path: "{{ camillagui_install_dir }}/camillagui_backend/camillagui_backend"
  register: camilladsp_camillagui_stat

- name: Download and install CamillaGUI bundle
  when: not camilladsp_camillagui_stat.stat.exists
  block:
    - name: Ensure CamillaGUI directory exists
      ansible.builtin.file:
        path: "{{ camillagui_install_dir }}"
        state: directory
        mode: "0755"

    - name: Download CamillaGUI bundle
      ansible.builtin.get_url:
        url: "https://github.com/HEnquist/camillagui-backend/releases/download/v{{ camillagui_version }}/bundle_linux_aarch64.tar.gz"
        dest: "{{ camillagui_install_dir }}/bundle_linux_aarch64.tar.gz"
        mode: "0644"

    - name: Extract CamillaGUI bundle
      ansible.builtin.unarchive:
        src: "{{ camillagui_install_dir }}/bundle_linux_aarch64.tar.gz"
        dest: "{{ camillagui_install_dir }}"
        remote_src: true

- name: Ensure CamillaDSP directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ camilladsp_config_dir }}"
    - "{{ camilladsp_config_dir }}/configs"
    - "{{ camilladsp_config_dir }}/coeffs"
    - "{{ camilladsp_config_dir }}/filters"

- name: Deploy CamillaDSP config presets
  ansible.builtin.template:
    src: "configs/{{ item }}.j2"
    dest: "{{ camilladsp_config_dir }}/configs/{{ item }}"
    mode: "0644"
    backup: true
  loop:
    - camilla.yml
    - flat.yml
    - late-night.yml
    - reference.yml
    - relaxed.yml
    - tonecontrol.yml
    - warm.yml
  notify: Restart Camilladsp

- name: Initialize CamillaDSP statefile if absent
  ansible.builtin.copy:
    content: "---\nconfig_path: {{ camilladsp_config_dir }}/configs/camilla.yml\n"
    dest: "{{ camilladsp_config_dir }}/statefile.yml"
    force: false
    mode: "0644"

- name: Deploy CamillaGUI backend config
  ansible.builtin.template:
    src: camillagui.yml.j2
    dest: "{{ camillagui_install_dir }}/camillagui.yml"
    mode: "0644"
  notify: Restart Camillagui

- name: Deploy sudoers rule for MQTT-triggered camilladsp start
  ansible.builtin.template:
    src: camilladsp-sudoers.j2
    dest: /etc/sudoers.d/camilladsp-control
    mode: "0440"
    validate: "visudo -cf %s"
  become: true
  when: camilladsp_mqtt_control_enabled

- name: Deploy udev rule for DAC hot-plug
  ansible.builtin.template:
    src: camilladsp-dac.rules.j2
    dest: /etc/udev/rules.d/99-camilladsp-dac.rules
    mode: "0644"
  become: true
  when: camilladsp_udev_usb_id is defined
  notify: Reload Udev Rules

- name: Deploy CamillaDSP ALSA readiness wait script
  ansible.builtin.template:
    src: camilladsp-wait-alsa.sh.j2
    dest: /usr/local/sbin/camilladsp-wait-alsa
    mode: "0755"
  become: true
  when: camilladsp_playback_card_name is defined

- name: Deploy CamillaDSP recovery helper
  ansible.builtin.template:
    src: camilladsp-recover.sh.j2
    dest: /usr/local/sbin/camilladsp-recover
    mode: "0755"
  become: true
  when: camilladsp_recover_enabled

- name: Deploy CamillaDSP systemd service
  ansible.builtin.template:
    src: camilladsp.service.j2
    dest: /etc/systemd/system/camilladsp.service
    mode: "0644"
  become: true
  notify: Reload And Restart Camilladsp

- name: Deploy CamillaDSP recovery systemd service
  ansible.builtin.template:
    src: camilladsp-recover.service.j2
    dest: /etc/systemd/system/camilladsp-recover.service
    mode: "0644"
  become: true
  when: camilladsp_recover_enabled

- name: Deploy CamillaDSP recovery timer
  ansible.builtin.template:
    src: camilladsp-recover.timer.j2
    dest: /etc/systemd/system/camilladsp-recover.timer
    mode: "0644"
  become: true
  when: camilladsp_recover_enabled

- name: Deploy CamillaGUI systemd service
  ansible.builtin.template:
    src: camillagui.service.j2
    dest: /etc/systemd/system/camillagui.service
    mode: "0644"
  become: true
  notify: Reload And Restart Camillagui

- name: Enable and start CamillaDSP
  ansible.builtin.systemd:
    name: camilladsp.service
    enabled: true
    state: "{{ 'started' if (camilladsp_playback_card_present or camilladsp_require_playback_card_present | bool) else 'stopped' }}"
    daemon_reload: true
  become: true

- name: Check CamillaDSP service state
  ansible.builtin.command:
    argv: [systemctl, is-active, camilladsp.service]
  register: camilladsp_service_active
  changed_when: false
  failed_when: camilladsp_service_active.stdout != "active"
  become: true
  when: camilladsp_playback_card_present or camilladsp_require_playback_card_present | bool

- name: Enable and start CamillaDSP recovery timer
  ansible.builtin.systemd:
    name: camilladsp-recover.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: camilladsp_recover_enabled

- name: Enable and start CamillaGUI
  ansible.builtin.systemd:
    name: camillagui.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
