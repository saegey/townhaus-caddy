---
- name: Reload Udev Rules
  ansible.builtin.command: udevadm control --reload-rules
  become: true
  changed_when: true

- name: Restart Camilladsp
  ansible.builtin.systemd:
    name: camilladsp.service
    state: restarted
  become: true

- name: Restart Camillagui
  ansible.builtin.systemd:
    name: camillagui.service
    state: restarted
  become: true

- name: Reload And Restart Camilladsp
  ansible.builtin.systemd:
    name: camilladsp.service
    state: restarted
    daemon_reload: true
  become: true

- name: Reload And Restart Camillagui
  ansible.builtin.systemd:
    name: camillagui.service
    state: restarted
    daemon_reload: true
  become: true
