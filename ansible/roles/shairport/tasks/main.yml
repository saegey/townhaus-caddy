---
- name: Resolve MQTT username from 1Password
  ansible.builtin.command:
    argv: [op, read, "{{ aswitch_mqtt_user_ref }}"]
  delegate_to: localhost
  register: _mqtt_user_result
  changed_when: false
  no_log: true

- name: Resolve MQTT password from 1Password
  ansible.builtin.command:
    argv: [op, read, "{{ aswitch_mqtt_pass_ref }}"]
  delegate_to: localhost
  register: _mqtt_pass_result
  changed_when: false
  no_log: true

- name: Store resolved MQTT credentials
  ansible.builtin.set_fact:
    _mqtt_user: "{{ _mqtt_user_result.stdout }}"
    _mqtt_pass: "{{ _mqtt_pass_result.stdout }}"
  no_log: true

- name: Deploy shairport-sync config
  ansible.builtin.template:
    src: shairport-sync.conf.j2
    dest: /etc/shairport-sync.conf
    mode: "0644"
  become: true
  notify: restart shairport-sync
