---
- name: Deploy townhaus-caddy stack
  hosts: townhaus_caddy
  gather_facts: false
  pre_tasks:
    - name: Require an Immich DB password reference
      ansible.builtin.assert:
        that:
          - townhaus_caddy_immich_db_password_ref is defined
          - townhaus_caddy_immich_db_password_ref | length > 0
          - townhaus_caddy_immich_db_password_ref != "op://Vault/Item/field"
        fail_msg: >-
          Define townhaus_caddy_immich_db_password_ref as a 1Password secret reference,
          for example op://Homelab/ImmichDatabase/password.

    - name: Check 1Password CLI availability on the control machine
      ansible.builtin.command:
        argv:
          - op
          - --version
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: inventory_hostname == ansible_play_hosts_all[0]
      changed_when: false

    - name: Resolve Immich DB password from 1Password CLI
      ansible.builtin.command:
        argv:
          - op
          - read
          - "{{ townhaus_caddy_immich_db_password_ref }}"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: inventory_hostname == ansible_play_hosts_all[0]
      register: townhaus_caddy_immich_db_password_result
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require successful 1Password secret resolution
      ansible.builtin.assert:
        that:
          - hostvars[ansible_play_hosts_all[0]].townhaus_caddy_immich_db_password_result.rc == 0
          - hostvars[ansible_play_hosts_all[0]].townhaus_caddy_immich_db_password_result.stdout | length > 0
        fail_msg: >-
          Failed to resolve townhaus_caddy_immich_db_password_ref with `op read`
          on the control machine. Verify that 1Password CLI is signed in
          (`op whoami`) and that the secret reference works locally:
          `op read "{{ townhaus_caddy_immich_db_password_ref }}"`.

    - name: Require a Grafana admin password reference
      ansible.builtin.assert:
        that:
          - townhaus_caddy_grafana_admin_password_ref is defined
          - townhaus_caddy_grafana_admin_password_ref | length > 0
          - townhaus_caddy_grafana_admin_password_ref != "op://Vault/Item/field"
        fail_msg: >-
          Define townhaus_caddy_grafana_admin_password_ref as a 1Password secret reference,
          for example op://Homelab/Grafana/password.

    - name: Store resolved Immich DB password on first host
      ansible.builtin.set_fact:
        townhaus_caddy_immich_db_password_shared: "{{ townhaus_caddy_immich_db_password_result.stdout }}"
      when: inventory_hostname == ansible_play_hosts_all[0]
      no_log: true

    - name: Store resolved Immich DB password
      ansible.builtin.set_fact:
        townhaus_caddy_immich_db_password: "{{ hostvars[ansible_play_hosts_all[0]].townhaus_caddy_immich_db_password_shared }}"
      no_log: true

    - name: Resolve Grafana admin password from 1Password CLI
      ansible.builtin.command:
        argv:
          - op
          - read
          - "{{ townhaus_caddy_grafana_admin_password_ref }}"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: inventory_hostname == ansible_play_hosts_all[0]
      register: townhaus_caddy_grafana_admin_password_result
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require successful Grafana password resolution
      ansible.builtin.assert:
        that:
          - hostvars[ansible_play_hosts_all[0]].townhaus_caddy_grafana_admin_password_result.rc == 0
          - hostvars[ansible_play_hosts_all[0]].townhaus_caddy_grafana_admin_password_result.stdout | length > 0
        fail_msg: >-
          Failed to resolve townhaus_caddy_grafana_admin_password_ref with `op read`
          on the control machine. Verify that 1Password CLI is signed in
          (`op whoami`) and that the secret reference works locally:
          `op read "{{ townhaus_caddy_grafana_admin_password_ref }}"`.

    - name: Store resolved Grafana admin password on first host
      ansible.builtin.set_fact:
        townhaus_caddy_grafana_admin_password_shared: "{{ townhaus_caddy_grafana_admin_password_result.stdout }}"
      when: inventory_hostname == ansible_play_hosts_all[0]
      no_log: true

    - name: Store resolved Grafana admin password
      ansible.builtin.set_fact:
        townhaus_caddy_grafana_admin_password: "{{ hostvars[ansible_play_hosts_all[0]].townhaus_caddy_grafana_admin_password_shared }}"
      no_log: true
  tasks:
    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ townhaus_caddy_app_dir }}"
        state: directory
        owner: "{{ townhaus_caddy_owner }}"
        group: "{{ townhaus_caddy_group }}"
        mode: "0755"

    - name: Ensure Immich library directory exists
      ansible.builtin.file:
        path: "{{ townhaus_caddy_env.IMMICH_UPLOAD_LOCATION }}"
        state: directory
        owner: "{{ townhaus_caddy_owner }}"
        group: "{{ townhaus_caddy_group }}"
        mode: "0755"

    - name: Ensure Immich Postgres directory exists without changing ownership
      ansible.builtin.file:
        path: "{{ townhaus_caddy_env.IMMICH_DB_DATA_LOCATION }}"
        state: directory
        mode: "0700"

    - name: Copy stack files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ townhaus_caddy_app_dir }}/{{ item.dest }}"
        owner: "{{ townhaus_caddy_owner }}"
        group: "{{ townhaus_caddy_group }}"
        mode: "{{ item.mode }}"
      loop:
        - src: ../docker-compose.yml
          dest: docker-compose.yml
          mode: "0644"
        - src: ../README.md
          dest: README.md
          mode: "0644"

    - name: Ensure portal directory exists
      ansible.builtin.file:
        path: "{{ townhaus_caddy_app_dir }}/services/portal"
        state: directory
        owner: "{{ townhaus_caddy_owner }}"
        group: "{{ townhaus_caddy_group }}"
        mode: "0755"
      become: true

    - name: Copy portal assets
      ansible.builtin.copy:
        src: ../services/portal/
        dest: "{{ townhaus_caddy_app_dir }}/services/portal/"
        owner: "{{ townhaus_caddy_owner }}"
        group: "{{ townhaus_caddy_group }}"
        mode: preserve
      become: true

    - name: Copy observability assets
      ansible.builtin.copy:
        src: ../services/observability/
        dest: "{{ townhaus_caddy_app_dir }}/services/observability/"
        owner: "{{ townhaus_caddy_owner }}"
        group: "{{ townhaus_caddy_group }}"
        mode: "0644"
        directory_mode: "0755"
      become: true
      notify: Recreate observability services

    - name: Copy Caddyfile
      ansible.builtin.copy:
        src: ../Caddyfile
        dest: "{{ townhaus_caddy_app_dir }}/Caddyfile"
        owner: "{{ townhaus_caddy_owner }}"
        group: "{{ townhaus_caddy_group }}"
        mode: "0644"
      notify: Recreate Caddy

    - name: Render environment file
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ townhaus_caddy_app_dir }}/.env"
        owner: "{{ townhaus_caddy_owner }}"
        group: "{{ townhaus_caddy_group }}"
        mode: "0600"
      no_log: true

    - name: Inspect existing Uptime Kuma container
      ansible.builtin.command:
        argv: [docker, inspect, uptime_kuma]
      register: townhaus_caddy_uptime_kuma_container
      changed_when: false
      failed_when: false

    - name: Ensure Uptime Kuma backup directory exists
      ansible.builtin.file:
        path: "{{ townhaus_caddy_uptime_kuma_backup_dir | default('/srv/storage/uptime-kuma-backups') }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    - name: Check for Uptime Kuma v1 pre-upgrade backup
      ansible.builtin.stat:
        path: >-
          {{ townhaus_caddy_uptime_kuma_backup_dir | default('/srv/storage/uptime-kuma-backups') }}/uptime-kuma-v1-pre-upgrade.tar.gz
      register: townhaus_caddy_uptime_kuma_backup
      become: true

    - name: Back up Uptime Kuma v1 data before upgrading to v2
      when:
        - "'louislam/uptime-kuma:1' in townhaus_caddy_uptime_kuma_container.stdout"
        - not townhaus_caddy_uptime_kuma_backup.stat.exists
      block:
        - name: Stop Uptime Kuma for a consistent database backup
          ansible.builtin.command:
            argv: [docker, stop, uptime_kuma]
          become: true
          changed_when: true

        - name: Archive the Uptime Kuma data volume
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - -v
              - "{{ townhaus_caddy_compose_project_name }}_uptime_kuma_data:/data:ro"
              - -v
              - "{{ townhaus_caddy_uptime_kuma_backup_dir | default('/srv/storage/uptime-kuma-backups') }}:/backup"
              - alpine:3.21
              - sh
              - -ec
              - >-
                tar -C /data -czf /backup/.uptime-kuma-v1-pre-upgrade.tar.gz.tmp . &&
                mv /backup/.uptime-kuma-v1-pre-upgrade.tar.gz.tmp /backup/uptime-kuma-v1-pre-upgrade.tar.gz
          become: true
          changed_when: true
      always:
        - name: Restart Uptime Kuma after the backup
          ansible.builtin.command:
            argv: [docker, start, uptime_kuma]
          become: true
          changed_when: true
          failed_when: false

    - name: Pull updated images
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - pull
      args:
        chdir: "{{ townhaus_caddy_app_dir }}"
      register: townhaus_caddy_pull_result
      changed_when: "'Downloaded newer image' in townhaus_caddy_pull_result.stdout or 'Pull complete' in townhaus_caddy_pull_result.stdout"
      when: townhaus_caddy_pull_images | bool

    - name: Ensure Groovenet shared network exists
      ansible.builtin.command:
        argv:
          - docker
          - network
          - create
          - "{{ townhaus_caddy_env.GROOVENET_DOCKER_NETWORK | default('dj-playlist_default') }}"
      register: townhaus_caddy_groovenet_network_result
      changed_when: townhaus_caddy_groovenet_network_result.rc == 0
      failed_when:
        - townhaus_caddy_groovenet_network_result.rc != 0
        - "'already exists' not in townhaus_caddy_groovenet_network_result.stderr"

    - name: Start or update stack
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -p
          - "{{ townhaus_caddy_compose_project_name }}"
          - up
          - -d
      args:
        chdir: "{{ townhaus_caddy_app_dir }}"
      register: townhaus_caddy_up_result
      changed_when: >
        'Creating' in townhaus_caddy_up_result.stdout or
        'Recreating' in townhaus_caddy_up_result.stdout or
        'Starting' in townhaus_caddy_up_result.stdout

    - name: Show compose status
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -p
          - "{{ townhaus_caddy_compose_project_name }}"
          - ps
      args:
        chdir: "{{ townhaus_caddy_app_dir }}"
      register: townhaus_caddy_ps_result
      changed_when: false

    - name: Print compose status
      ansible.builtin.debug:
        var: townhaus_caddy_ps_result.stdout_lines

  handlers:
    - name: Recreate observability services
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -p
          - "{{ townhaus_caddy_compose_project_name }}"
          - up
          - -d
          - --force-recreate
          - loki
          - grafana
      args:
        chdir: "{{ townhaus_caddy_app_dir }}"
      changed_when: true

    - name: Recreate Caddy
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -p
          - "{{ townhaus_caddy_compose_project_name }}"
          - up
          - -d
          - --force-recreate
          - caddy
      args:
        chdir: "{{ townhaus_caddy_app_dir }}"
      changed_when: true
