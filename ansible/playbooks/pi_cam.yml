---
- name: Deploy pi-cam.local services
  hosts: pi_cam
  gather_facts: true

  pre_tasks:
    - name: Verify 1Password CLI is available
      ansible.builtin.command:
        argv: [op, --version]
      delegate_to: localhost
      run_once: true
      changed_when: false

  roles:
    - role: shairport
    - role: camilladsp
    - role: aswitch_services
    - role: beszel_agent
